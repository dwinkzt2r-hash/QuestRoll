<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuestRoll – Question Bank Randomizer</title>
<meta name="description" content="Roll a random question from your serial question bank. Offline study companion.">
<meta name="theme-color" content="#0b0d1a"><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0b0d1a;--ink:#eef0ff;--mut:#8b90b5;--a:#7c5cff;--b:#22d3ee;--g:#34d399;--card:rgba(255,255,255,.06);--ln:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.33;z-index:-1;animation:dr 18s ease-in-out infinite alternate}
body:before{background:var(--a);top:-25vmax;left:-20vmax}body:after{background:var(--b);bottom:-30vmax;right:-20vmax;animation-delay:-9s}
@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#app{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px}h1{margin:0;font-size:22px;letter-spacing:-.5px;flex:1}h1 span{color:var(--b)}
button,input{font:inherit;color:inherit}
#chip{font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--ln);padding:7px 11px;border-radius:99px}
.ib{background:var(--card);border:1px solid var(--ln);border-radius:12px;width:42px;height:42px;font-size:18px}
.pill{align-self:center;background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:9px 18px;font-weight:600}
.card{background:var(--card);border:1px solid var(--ln);border-radius:28px;padding:26px 14px 14px;text-align:center;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#reel{display:flex;gap:10px;justify-content:center;transition:opacity .4s}#reel.idle{opacity:.4}
.col{--h:clamp(84px,26vw,128px);height:var(--h);width:calc(var(--h)*.72);overflow:hidden;border-radius:18px;background:linear-gradient(#1c2040,#0f1228);border:1px solid var(--ln);box-shadow:inset 0 10px 20px rgba(255,255,255,.07),inset 0 -14px 24px rgba(0,0,0,.5),0 0 28px rgba(124,92,255,.3)}
.strip{will-change:transform}.strip b{display:grid;place-items:center;height:var(--h);font-size:calc(var(--h)*.74);font-weight:800;text-shadow:0 0 22px var(--a)}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.93)}60%{transform:scale(1.035)}}
#meta{margin:16px 0 4px;color:var(--mut);min-height:24px}.g{color:var(--g)}
.stars{display:flex;justify-content:center;gap:4px}.stars button{background:none;border:0;font-size:34px;color:#434972;transition:.15s;padding:2px 5px}.stars .on{color:#fbbf24;transform:scale(1.15);text-shadow:0 0 14px #fbbf2488}
.bar{height:8px;border-radius:9px;background:var(--card);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .8s cubic-bezier(.2,.9,.2,1)}
#goal{margin:-6px 0 0;text-align:center;color:var(--mut);font-size:14px}
.row{display:flex;gap:10px}
.btn{border:1px solid var(--ln);border-radius:18px;padding:16px;font-weight:700;font-size:17px;background:var(--card);cursor:pointer;transition:transform .12s,background .2s;text-align:center}.btn:active{transform:scale(.95)}
.btn.sm{padding:12px;font-size:15px;border-radius:14px}
#roll{flex:1.5;border:0;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 30px rgba(124,92,255,.5);animation:gl 2.6s infinite}@keyframes gl{50%{box-shadow:0 8px 46px rgba(34,211,238,.6)}}
#done{flex:1}#done.on{background:var(--g);color:#032;border:0}
#go{flex:1;min-width:0;border-radius:14px;border:1px solid var(--ln);background:var(--card);padding:0 12px}#pomo.on{color:var(--b);border-color:var(--b)}
dialog{width:min(92vw,460px);max-height:88dvh;background:#13162e;color:var(--ink);border:1px solid var(--ln);border-radius:24px;padding:18px}dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 12px}dialog label{display:block;font-size:14px;color:var(--mut);margin-bottom:10px}dialog input:not([type=file]){display:block;width:100%;margin-top:4px;padding:11px;border-radius:12px;border:1px solid var(--ln);background:#0b0d1a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{color:var(--b);margin:0 0 12px}dialog .row{margin-bottom:12px;flex-wrap:wrap}dialog .btn:last-child{width:100%}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-bottom:12px;max-height:60dvh;overflow:auto}
#grid button{aspect-ratio:1;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-weight:600}
#grid .d{background:var(--g);color:#032;border:0}#grid .x{background:repeating-linear-gradient(45deg,#2a2d4d 0 4px,#171a33 4px 8px)}#grid .o{opacity:.3}#grid .c{outline:2px solid var(--b)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:#fff;color:#111;padding:10px 18px;border-radius:99px;font-weight:600;transition:.3s;z-index:10;pointer-events:none;white-space:nowrap}#toast.on{transform:translate(-50%,0);opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--b);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,:before,:after{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
<header><h1>Quest<span>Roll</span></h1><span id="chip"></span><button class="ib" id="snd" aria-label="Toggle sound"></button><button class="ib" id="cfg" aria-label="Settings">⚙️</button></header>
<button class="pill" id="pool"></button>
<section class="card" id="card"><div id="reel" class="idle"></div><p id="meta"></p><div class="stars" id="stars"></div></section>
<div class="bar"><i id="bar"></i></div><p id="goal"></p>
<div class="row"><button class="btn" id="done">✓ Complete</button><button class="btn" id="roll">🎲 ROLL</button></div>
<div class="row"><input id="go" type="number" min="1" inputmode="numeric" placeholder="Go to #"><button class="btn sm" id="goB">Go</button><button class="btn sm" id="ex" aria-label="Exclude this question">🚫</button><button class="btn sm" id="pomo">⏱ 25:00</button><button class="btn sm" id="map" aria-label="Question map">🗺</button></div>
</div>
<dialog id="cfgD"><form method="dialog"><h2>Pool &amp; settings</h2>
<label>Total questions in your bank<input id="iT" type="number" min="1" max="5000"></label>
<div class="two"><label>Roll from #<input id="iF" type="number" min="1"></label><label>Roll to #<input id="iU" type="number" min="1"></label></div>
<label>Exclude numbers (e.g. 3, 7, 10-12)<input id="iE" placeholder="none"></label>
<label>Daily goal (questions)<input id="iG" type="number" min="1" max="200"></label>
<p class="hint" id="pc"></p>
<div class="row"><button type="button" class="btn sm" id="exp">Export</button><label class="btn sm" for="imp" style="margin:0">Import</label><input id="imp" type="file" accept=".json" hidden><button type="button" class="btn sm" id="rst">Reset</button><button type="button" class="btn sm" id="inst" hidden>Install</button></div>
<button class="btn">Done</button></form></dialog>
<dialog id="mapD"><form method="dialog"><h2>Question map</h2><div id="grid"></div><button class="btn">Close</button></form></dialog>
<canvas id="fx"></canvas><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='questroll.v1',R=matchMedia('(prefers-reduced-motion:reduce)').matches,
Q=['Pick a number. Beat the boredom.','One question at a time.','Future you says thanks.','Small wins add up.'],LB=['Easy','Okay','Medium','Hard','Brutal'];
let S=Object.assign({total:100,from:1,to:100,ex:'',it:{},cur:null,xp:0,days:{},snd:1,goal:5,hist:[]},JSON.parse(localStorage.getItem(K)||'{}'));
if(!localStorage.getItem(K))S.to=S.total;
const save=()=>localStorage.setItem(K,JSON.stringify(S)),today=()=>new Date().toLocaleDateString('en-CA'),rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n,lv=()=>Math.floor(Math.sqrt(S.xp/50))+1;
const exSet=()=>{const s=new Set();S.ex.split(/[,\s]+/).forEach(p=>{const m=p.match(/^(\d+)(?:-(\d+))?$/);if(m)for(let i=+m[1];i<=+(m[2]||m[1])&&s.size<20000;i++)s.add(i)});return s};
const pool=()=>{const e=exSet(),a=[];for(let n=S.from;n<=S.to;n++)if(!e.has(n)&&!(S.it[n]&&S.it[n].d))a.push(n);return a};
const streak=()=>{let c=0,d=new Date();if(!S.days[today()])d.setDate(d.getDate()-1);while(S.days[d.toLocaleDateString('en-CA')]>0){c++;d.setDate(d.getDate()-1)}return c};
let AC;const tone=(f,d=.12,t='sine',v=.15,w=0)=>{if(!S.snd)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();AC.resume();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+w;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}};
const buzz=p=>navigator.vibrate&&navigator.vibrate(p);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2300)};
function confetti(){if(R)return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:100},()=>({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,r:Math.random()*5+3,c:`hsl(${Math.random()*360} 90% 62%)`,a:Math.random()*6}));let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.36;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<110)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
function build(){const L=String(S.total).length,r=$('#reel');r.innerHTML='';for(let i=0;i<L;i++){const c=document.createElement('div'),s=document.createElement('div');c.className='col';s.className='strip';s.innerHTML=Array.from({length:10*(i+4)},(_,k)=>`<b>${k%10}</b>`).join('');c.append(s);r.append(c)}}
function setReel(n,anim){const cs=[...$('#reel').children],ds=String(n==null?0:n).padStart(cs.length,'0').slice(-cs.length);cs.forEach((c,i)=>{const s=c.firstChild,len=s.children.length,d=+ds[i],cur=s._d||0;s._d=d;const rest=`translateY(${-d/len*100}%)`;if(!anim||R){s.style.transform=rest;return}const st=10*(i+2)+((d-cur+10)%10),to=`translateY(${-(cur+st)/len*100}%)`;s.animate([{transform:`translateY(${-cur/len*100}%)`},{transform:to}],{duration:1100+i*350,easing:'cubic-bezier(.15,.8,.15,1)'}).onfinish=()=>s.style.transform=rest;s.style.transform=to})}
let busy=0;
function pick(n,anim){if(busy)return;S.cur=n;S.hist=[...S.hist.slice(-9),n];$('#reel').classList.remove('idle');setReel(n,anim);save();
if(anim&&!R){busy=1;const L=$('#reel').children.length;for(let i=0;i<16;i++)tone(950-i*28,.03,'square',.04,Math.pow(i/16,1.8)*1.3);buzz(15);
setTimeout(()=>{busy=0;tone(523,.15,'triangle',.2);tone(784,.3,'triangle',.2,.1);buzz(30);const c=$('#card');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')},1100+(L-1)*350+60)}render()}
function roll(){if(busy)return;const p=pool();if(!p.length)return toast(S.from>S.to?'Range is empty – fix From/To':'Pool empty – everything done! 🎉');const q=p.filter(x=>!S.hist.slice(-3).includes(x));pick((q.length?q:p)[rnd((q.length?q:p).length)],1)}
function done(){const n=S.cur;if(n==null)return toast('Roll a question first');const it=S.it[n]=S.it[n]||{},t=today(),l0=lv();it.d=it.d?0:1;S.days[t]=Math.max(0,(S.days[t]||0)+(it.d?1:-1));S.xp=Math.max(0,S.xp+(it.d?10:-10));
if(it.d){confetti();[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.08));buzz([20,30,40]);if(S.days[t]==S.goal)setTimeout(()=>{toast('🏆 Daily goal smashed!');confetti()},700);else if(lv()>l0)toast('⬆️ Level '+lv()+'!')}else tone(300,.15);save();render()}
function rate(r){if(S.cur==null)return toast('Roll a question first');const it=S.it[S.cur]=S.it[S.cur]||{};it.r=it.r==r?0:r;tone(500+r*110,.18,'triangle');buzz(10);save();render()}
function render(){const p=pool(),n=S.cur,it=S.it[n]||{},dn=Object.values(S.it).filter(x=>x.d).length,td=S.days[today()]||0;
$('#pool').textContent=`🎯 ${S.from}–${S.to} · ${p.length} left`;$('#chip').textContent=`🔥${streak()} · Lv${lv()}`;
$('#meta').innerHTML=n==null?Q[dn%Q.length]:`#${n} of ${S.total}${it.d?' · <b class=g>✓ done</b>':''}${it.r?' · '+LB[it.r-1]:''}`;
$('#done').classList.toggle('on',!!it.d);$('#done').textContent=it.d?'✓ Completed':'✓ Complete';
[...$('#stars').children].forEach((b,i)=>b.classList.toggle('on',i<(it.r||0)));
$('#bar').style.width=Math.min(100,dn/S.total*100)+'%';$('#goal').textContent=`Today ${td}/${S.goal}${td>=S.goal?' 🏆':''} · ${dn}/${S.total} done · ${S.xp} XP`;$('#snd').textContent=S.snd?'🔊':'🔇'}
$('#stars').innerHTML='<button>★</button>'.repeat(5);[...$('#stars').children].forEach((b,i)=>{b.ariaLabel=`Rate ${i+1} of 5`;b.onclick=()=>rate(i+1)});
$('#roll').onclick=roll;$('#done').onclick=done;$('#snd').onclick=()=>{S.snd=S.snd?0:1;save();render();tone(660,.1)};
$('#goB').onclick=()=>{const n=+$('#go').value;if(n<1||n>S.total)return toast('Pick 1–'+S.total);pick(n,1);$('#go').value=''};
$('#ex').onclick=()=>{if(S.cur==null)return toast('Roll a question first');S.ex=(S.ex?S.ex+', ':'')+S.cur;save();tone(220,.2,'sawtooth',.08);toast('Excluded #'+S.cur);roll()};
let pt=1500,pi=0;const pf=()=>`⏱ ${Math.floor(pt/60)}:${String(pt%60).padStart(2,'0')}`;
$('#pomo').onclick=()=>{if(pi){clearInterval(pi);pi=0;$('#pomo').classList.remove('on');return}$('#pomo').classList.add('on');tone(660,.1);pi=setInterval(()=>{if(--pt<=0){clearInterval(pi);pi=0;pt=1500;$('#pomo').classList.remove('on');[0,.25,.5].forEach(w=>tone(880,.4,'sine',.2,w));buzz([200,100,200]);toast('Focus done – take 5 ☕')}$('#pomo').textContent=pf()},1000)};
$('#map').onclick=()=>{const e=exSet(),g=$('#grid');g.innerHTML='';for(let n=1;n<=S.total;n++){const b=document.createElement('button'),it=S.it[n]||{};b.textContent=n;b.className=(it.d?'d ':'')+(e.has(n)?'x ':'')+(n<S.from||n>S.to?'o ':'')+(n==S.cur?'c':'');b.onclick=()=>{$('#mapD').close();pick(n,0)};g.append(b)}$('#mapD').showModal()};
const fill=()=>{$('#iT').value=S.total;$('#iF').value=S.from;$('#iU').value=S.to;$('#iE').value=S.ex;$('#iG').value=S.goal;$('#pc').textContent=`${pool().length} questions in the pool`};
const apply=()=>{S.total=Math.max(1,Math.min(5000,+$('#iT').value||1));S.from=Math.max(1,+$('#iF').value||1);S.to=Math.min(S.total,+$('#iU').value||S.total);S.ex=$('#iE').value;S.goal=Math.max(1,+$('#iG').value||5);save();if($('#reel').children.length!=String(S.total).length){build();setReel(S.cur,0)}$('#pc').textContent=`${pool().length} questions in the pool`;render()};
['#iT','#iF','#iU','#iE','#iG'].forEach(s=>$(s).oninput=apply);$('#cfg').onclick=$('#pool').onclick=()=>{fill();$('#cfgD').showModal()};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='questroll-backup-'+today()+'.json';a.click()};
$('#imp').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{try{S=Object.assign(S,JSON.parse(t));save();location.reload()}catch(x){toast('Not a valid backup')}})};
$('#rst').onclick=()=>{if(confirm('Reset ALL progress? Export a backup first.')){S.it={};S.cur=null;S.xp=0;S.days={};S.hist=[];save();location.reload()}};
addEventListener('keydown',e=>{if(/INPUT/.test(e.target.tagName)||document.querySelector('dialog[open]'))return;if(e.code=='Space'){e.preventDefault();roll()}else if(e.key=='Enter'||e.key=='c')done();else if(/^[1-5]$/.test(e.key))rate(+e.key)});
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=0});$('#inst').onclick=()=>ip&&ip.prompt();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
build();if(S.cur!=null){$('#reel').classList.remove('idle');setReel(S.cur,0)}render();
if(location.search.includes('action=roll'))setTimeout(roll,500);
</script></body></html>
